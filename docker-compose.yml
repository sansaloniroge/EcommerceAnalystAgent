services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-agent-postgres
    environment:
      POSTGRES_DB: ecommerce_agent
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ecommerce_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_data:
