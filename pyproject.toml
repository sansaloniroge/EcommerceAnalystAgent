[tool.poetry]
name = "ecommerce-analyst-agent"
version = "0.1.0"
description = "Agent that answers e-commerce analytics questions via real SQL/tool-calling, evaluated on objective correctness."
authors = ["Roge Sansaloni <sansaloniroge@gmail.com>"]
readme = "README.md"

packages = [
  { include = "app", from = "src" },
  { include = "scripts", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = "^0.116.1"
uvicorn = {extras = ["standard"], version = "^0.35.0"}
pydantic = "^2.11.7"
openai = "^1.86.0"
python-dotenv = "^1.1.0"
psycopg = {version = "^3.2.3", extras = ["binary"]}
pandas = "^2.2.3"
langgraph = "^1.2.11"
langchain-core = "^1.6.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^5.0.0"
ruff = "^0.6.9"
mypy = "^1.11.0"

[tool.poetry.scripts]
load-dataset = "scripts.load_dataset:main"
run-eval = "scripts.eval_runner:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
